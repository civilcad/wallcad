<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1d2127">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>WallCAD</title>
<style>
:root{--bg:#14171b;--panel:#1d2127;--panel2:#272c34;--line:#333a45;--tx:#e7e9ec;--tx2:#9aa3ae;--acc:#3d9cf0;--acc2:#1f4f7c;--danger:#e5534b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overscroll-behavior:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:2px;padding:1px 4px;background:var(--panel);border-bottom:1px solid var(--line);min-height:40px}
.ib{width:38px;height:38px;border:0;background:transparent;color:var(--tx);border-radius:8px;display:grid;place-items:center;flex:0 0 auto;padding:0}
.ib:active,.tb:active,.b:active{filter:brightness(1.3)}
.ib:disabled{opacity:.35}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#title{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
#title small{display:block;font-weight:400;color:var(--tx2);font-size:10.5px}
#cmd{display:flex;align-items:center;gap:4px;padding:2px 5px;height:38px;background:#0f1215;border-bottom:1px solid var(--line);min-height:34px}
#prompt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:30px;font:11px/1.3 ui-monospace,"Roboto Mono",Menlo,monospace;color:#cfd6de}
#prompt b{color:var(--acc);font-weight:700}
.chip{border:1px solid var(--line);background:transparent;color:var(--tx2);font:700 10px/1 system-ui,sans-serif;padding:6px 5px;border-radius:6px;letter-spacing:.3px;flex:0 0 auto}
.chip.esc{color:#ff8a84;border-color:#7a3a37;padding:7px 9px;font-size:11.5px}
.chip.on{background:var(--acc2);color:#fff;border-color:var(--acc)}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.fabs{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.fab{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(29,33,39,.92);color:var(--tx);display:grid;place-items:center;padding:0}
#bar{background:var(--panel);border-top:1px solid var(--line);padding:4px 5px;display:none}
#bar .b,#bar input,#bar select{height:34px}#bar .b{padding:0 10px;font-size:13.5px}#bar .b.sq{width:38px}#bar .row+.row{margin-top:4px}
#bar input.sw{width:40px;padding:2px}
#bar .b img{width:30px;height:20px;vertical-align:middle;margin-right:4px;border-radius:3px}
#bar.show{display:block}
.row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar,#tools::-webkit-scrollbar{display:none}
.row+.row{margin-top:6px}
.grow{flex:1;min-width:90px}
input,select,textarea{background:#0f1215;color:var(--tx);border:1px solid var(--line);border-radius:8px;height:40px;padding:0 10px;font-size:16px;min-width:0;font-family:inherit}
textarea{height:auto;padding:8px 10px}
input.ang{width:62px;flex:0 0 auto}
input.num{width:110px;flex:1 1 auto}
.b{height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font-size:14px;white-space:nowrap;flex:0 0 auto;font-family:inherit}
.b.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.b.sq{width:44px;padding:0;font-size:18px}
.b.dng{color:#ff8a84}
.b.on{background:var(--acc2);border-color:var(--acc)}
.cnt{color:var(--tx2);font-size:13px;padding:0 4px;white-space:nowrap}
#ribbon{background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs{display:flex;align-items:stretch}
#tabs button{flex:1;background:none;border:0;color:var(--tx2);padding:5px 0 4px;font:600 11.5px system-ui,sans-serif;border-bottom:2px solid transparent}
#tabs .tx{flex:0 0 34px;font-size:15px;padding:2px 0;color:var(--tx2)}#tabs .grip{cursor:grab;touch-action:none;font-size:16px;letter-spacing:-2px}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
#tools{display:flex;overflow-x:auto;gap:1px;padding:1px 3px 3px;scrollbar-width:none}
.tb{flex:0 0 auto;width:54px;height:44px;border:0;border-radius:8px;background:transparent;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9.5px;padding:0;font-family:inherit;line-height:1.1}
.tb img{width:22px;height:22px}.tb svg.i{width:20px;height:20px}
body.rb-min #tools{display:none}
header{grid-area:h}#cmd{grid-area:c}#stage{grid-area:s}#bar{grid-area:b}#ribbon{grid-area:r}
body.dock-l #app,body.dock-r #app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:46px minmax(0,1fr);grid-template-areas:"h h" "c c" "r s" "r b"}
body.dock-r #app{grid-template-columns:minmax(0,1fr) 46px;grid-template-areas:"h h" "c c" "s r" "b r"}
body.dock-l #ribbon,body.dock-r #ribbon{border-top:0;display:flex;flex-direction:column;min-height:0;padding-bottom:0}body.dock-l #ribbon{border-right:1px solid var(--line)}body.dock-r #ribbon{border-left:1px solid var(--line)}
body.dock-l #tabs,body.dock-r #tabs{flex-direction:column;border-bottom:1px solid var(--line)}body.dock-l #tabs button,body.dock-r #tabs button{flex:0 0 auto;padding:8px 0;font-size:10.5px;border-bottom:0;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.3px}body.dock-l #tabs button.on,body.dock-r #tabs button.on{background:var(--acc2);color:#fff}body.dock-l #tabs .tx,body.dock-r #tabs .tx{flex:0 0 auto;padding:5px 0;writing-mode:horizontal-tb;transform:none}#tabs .tx svg.i{width:18px;height:18px}
body.dock-l #tools,body.dock-r #tools{flex-direction:column;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;align-items:center;padding:2px 0;gap:1px}body.dock-l .tb.sep,body.dock-r .tb.sep{width:30px;height:1px;margin:2px 0;flex:0 0 1px}body.dock-l .tb,body.dock-r .tb{width:40px;height:38px;font-size:0;gap:0}body.dock-l .tb img,body.dock-r .tb img{width:26px;height:26px}
@media (min-width:900px){#bar.show{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}#bar.show>.row{flex:0 1 auto;max-width:100%}#bar .row+.row{margin-top:0}}
#v3{position:fixed;inset:0;z-index:8;background:#c7dbec;display:none;flex-direction:column}#v3.show{display:flex}
#v3bar{display:flex;align-items:center;gap:4px;padding:1px 6px;background:var(--panel);border-bottom:1px solid var(--line);min-height:40px}#v3bar .v3t{flex:1;font-size:14px}
#cv3{flex:1;width:100%;min-height:0;touch-action:none;display:block}
#v3hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#1d2127;font-size:12px;pointer-events:none;text-shadow:0 0 4px #fff}
#v3pad{position:absolute;right:12px;bottom:34px;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}#v3pad button{border:0;border-radius:12px;background:rgba(29,33,39,.82);color:#fff;font-size:20px;touch-action:none}#v3pad button:active{background:var(--acc)}
#dockZ{position:fixed;inset:0;z-index:20;display:none;pointer-events:none}#dockZ.show{display:block}#dockZ div{position:absolute;display:grid;place-items:center;border:2px dashed var(--acc);background:rgba(61,156,240,.12);color:#fff;font:600 14px system-ui,sans-serif;border-radius:10px}#dockZ div.on{background:rgba(61,156,240,.45)}
#dockZ .zl{left:6px;top:20%;bottom:20%;width:90px}#dockZ .zr{right:6px;top:20%;bottom:20%;width:90px}#dockZ .zb{left:20%;right:20%;bottom:6px;height:80px}
.tb.on{background:var(--acc2);color:#fff}
.tb.sep{width:1px;height:30px;align-self:center;background:var(--line);margin:0 2px;padding:0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
#ov.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));user-select:text;-webkit-user-select:text}
.sheet h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;justify-content:space-between}
.sheet label{display:block;color:var(--tx2);font-size:12px;margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%}
.sheet p,.sheet li{color:#cfd6de;font-size:14px}
.sheet .row input,.sheet .row select{width:auto}
.sheet .row input.sw{width:44px;height:40px;padding:2px;flex:0 0 auto}
.sheet h4{margin:16px 0 0;font-size:14px;color:var(--acc)}
.sheet .item input.sw{width:34px;height:34px;padding:2px;flex:0 0 auto}
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.item{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:6px 8px;min-height:48px}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{display:block;color:var(--tx2);font-size:11px}
.item.cur{outline:1.5px solid var(--acc)}
.sw{width:30px;height:30px;padding:0;border-radius:6px;border:1px solid var(--line);flex:0 0 auto}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu .b{height:52px;text-align:left;display:flex;align-items:center;gap:8px}
.hint{color:var(--tx2);font-size:12px;margin-top:8px}
#toast{position:fixed;left:50%;top:96px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;font-size:13px;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#upd{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;background:#10324f;border:1px solid var(--acc);border-radius:12px;padding:10px 10px 10px 14px;display:none;align-items:center;gap:8px;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#upd.show{display:flex}
#upd .t{flex:1;min-width:0;font-size:13.5px}
#upd .t small{display:block;color:#a9c7e3;font-size:11.5px}
.notes{padding-left:18px;margin:6px 0}
kbd{background:#0f1215;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="bMenu" aria-label="Menu"></button>
    <div id="title">WallCAD</div>
    <button class="ib" id="bUndo" aria-label="Undo"></button>
    <button class="ib" id="bRedo" aria-label="Redo"></button>
    <button class="ib" id="b3d" aria-label="3D view" title="3D view" style="font:700 13px system-ui,sans-serif;width:34px">3D</button>
    <button class="ib" id="bLayers" aria-label="Layers"></button>
    <button class="ib" id="bExport" aria-label="Export PDF"></button>
  </header>
  <div id="cmd">
    <button class="chip esc" id="cEsc" aria-label="Cancel command">ESC</button>
    <div id="prompt"></div>
    <button class="chip" id="cSnap">SNAP</button>
    <button class="chip" id="cGrid">GRID</button>
    <button class="chip" id="cOrtho">ORTHO</button>

  <div id="stage">
    <canvas id="cv"></canvas>

      <button class="fab" id="fOut" aria-label="Zoom out"></button>
    </div>
  </div>
  <form id="bar" autocomplete="off" action="#"></form>
  <nav id="ribbon">
    <div id="tabs"></div>
    <div id="tools"></div>
  </nav>
</div>
<div id="ov"><div class="sheet" id="sheet"></div></div>
<div id="v3"><div id="v3bar"></div><canvas id="cv3"></canvas><div id="v3hint"></div><div id="v3pad"><span></span><button data-k="f" aria-label="Walk forward">▲</button><span></span><button data-k="tl" aria-label="Turn left">⟲</button><button data-k="b" aria-label="Walk back">▼</button><button data-k="tr" aria-label="Turn right">⟳</button></div></div>
<div id="toast"></div>

<div id="upd" role="status"><div class="t"><b id="updT">Update available</b><small id="updS">Tap Update to get the newest version</small></div><button type="button" class="b" id="updNew">What’s new</button><button type="button" class="b pri" id="updGo">Update</button><button type="button" class="ib" id="updX" aria-label="Later">✕</button></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* ================= basics ================= */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, D2R=Math.PI/180;
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y), sub=(a,b)=>V(a.x-b.x,a.y-b.y), mul=(a,k)=>V(a.x*k,a.y*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y, crs=(a,b)=>a.x*b.y-a.y*b.x, len=a=>Math.hypot(a.x,a.y), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const nrm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l)}, perp=a=>V(-a.y,a.x);
const lerp=(a,b,t)=>V(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const polar=(c,r,a)=>V(c.x+r*Math.cos(a),c.y+r*Math.sin(a));
const rotP=(p,c,a)=>{const s=Math.sin(a),co=Math.cos(a),dx=p.x-c.x,dy=p.y-c.y;return V(c.x+dx*co-dy*s,c.y+dx*s+dy*co)};
const normA=a=>((a%TAU)+TAU)%TAU;
const angIn=(a,a0,a1)=>normA(a-a0)<=normA(a1-a0)+1e-9;
const clone=o=>JSON.parse(JSON.stringify(o));
function segT(p,a,b){const d=sub(b,a),l2=dot(d,d);return l2?dot(sub(p,a),d)/l2:0}
function distSeg(p,a,b){const t=Math.max(0,Math.min(1,segT(p,a,b)));return dist(p,lerp(a,b,t))}
function lineInt(a,b,c,d){const r=sub(b,a),s=sub(d,c),den=crs(r,s);if(Math.abs(den)<1e-12)return null;const ca=sub(c,a);const t=crs(ca,s)/den,u=crs(ca,r)/den;return{p:add(a,mul(r,t)),t,u}}
function lineCircle(a,b,c,r){const d=sub(b,a),f=sub(a,c);const A=dot(d,d),B=2*dot(f,d),C=dot(f,f)-r*r;let q=B*B-4*A*C;if(q<0||A===0)return[];q=Math.sqrt(q);return[(-B-q)/(2*A),(-B+q)/(2*A)]}
function circle3(a,b,c){const d=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y));if(Math.abs(d)<1e-9)return null;const a2=a.x*a.x+a.y*a.y,b2=b.x*b.x+b.y*b.y,c2=c.x*c.x+c.y*c.y;const cen=V((a2*(b.y-c.y)+b2*(c.y-a.y)+c2*(a.y-b.y))/d,(a2*(c.x-b.x)+b2*(a.x-c.x)+c2*(b.x-a.x))/d);return{c:cen,r:dist(cen,a)}}
function polyArea(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a.x*b.y-b.x*a.y}return s/2}
function polyCentroid(p){let A=0,cx=0,cy=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length],f=a.x*b.y-b.x*a.y;A+=f;cx+=(a.x+b.x)*f;cy+=(a.y+b.y)*f}if(Math.abs(A)<1e-6){let x=0,y=0;p.forEach(q=>{x+=q.x;y+=q.y});return V(x/p.length,y/p.length)}return V(cx/(3*A),cy/(3*A))}
function inPoly(pt,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if(((a.y>pt.y)!==(b.y>pt.y))&&(pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x))c=!c}return c}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= snapping ================= */

function snapPts(e,out){

    case'line':case'wall':P(e.a,'end');P(e.b,'end');P(lerp(e.a,e.b,.5),'mid');break;
    case'pline':case'room':e.pts.forEach((p,i)=>{P(p,'end');const q=e.pts[(i+1)%e.pts.length];if(i<e.pts.length-1||e.closed||e.type==='room')P(lerp(p,q,.5),'mid')});break;
    case'circle':P(e.c,'cen');for(let i=0;i<4;i++)P(polar(e.c,e.r,i*Math.PI/2),'end');break;
    case'arc':P(e.c,'cen');P(polar(e.c,e.r,e.a0),'end');P(polar(e.c,e.r,e.a1),'end');P(polar(e.c,e.r,e.a0+normA(e.a1-e.a0)/2),'mid');break;
    case'dim':P(e.a,'end');P(e.b,'end');break;
    case'text':P(e.p,'end');break;
    case'block':{P(e.p,'cen');const f=blockXf(e),hw=e.w/2,hd=e.d/2;[V(-hw,-hd),V(hw,-hd),V(hw,hd),V(-hw,hd)].forEach(q=>P(f(q),'end'));break}
  }}
function snapSegs(e,out){

}
function snapPoint(raw,base,mode){

    for(const e of doc.ents){if(!lvis(e.layer))continue;const b=entBBox(e);if(raw.x<b.x0-Rw||raw.x>b.x1+Rw||raw.y<b.y0-Rw||raw.y>b.y1+Rw)continue;snapPts(e,pts);snapSegs(e,segs)}

/* ================= hit testing ================= */
function primDist(pr,p){

    case'L':return distSeg(p,pr.a,pr.b);
    case'P':{let d=Infinity;const q=pr.pts;for(let i=0;i<q.length-1;i++)d=Math.min(d,distSeg(p,q[i],q[i+1]));if(pr.closed&&q.length>2)d=Math.min(d,distSeg(p,q[q.length-1],q[0]));return d}

function hitDist(e,p,tol){

function pickEnt(p,filter){const tol=16/view.z;let best=null,bd=Infinity;for(let i=doc.ents.length-1;i>=0;i--){const e=doc.ents[i];if(!lvis(e.layer)||llock(e.layer))continue;if(filter&&!filter(e))continue;const b=entBBox(e);if(p.x<b.x0-tol||p.x>b.x1+tol||p.y<b.y0-tol||p.y>b.y1+tol)continue;const d=hitDist(e,p,tol);if(d<bd-1e-9){bd=d;best=e}}return bd<=tol?best:null}

/* grips */
function grips(e){
  switch(e.type){
    case'line':case'wall':return[e.a,e.b,lerp(e.a,e.b,.5)];
    case'pline':return e.pts.slice();
    case'room':return e.pts.concat([e.lp||polyCentroid(e.pts)]);
    case'circle':return[e.c,polar(e.c,e.r,0)];
    case'arc':return[e.c,polar(e.c,e.r,e.a0),polar(e.c,e.r,e.a1)];
    case'dim':{const g=dimGeo(e);return[e.a,e.b,lerp(g.a2,g.b2,.5)]}
    case'text':return[e.p];
    case'block':{const f=blockXf(e),hw=e.w/2,hd=e.d/2;if(BLOCKS[e.b]&&BLOCKS[e.b].cut)return[e.p,f(V(hw,0)),f(V(-hw,0))];return[e.p,f(V(hw,0)),f(V(0,hd)),f(V(hw,hd)),f(V(0,hd+Math.max(28/view.z,e.d*0.18)))]}
  }return[]}

    case'pline':e.pts[i]=p;break;
    case'room':if(i<e.pts.length)e.pts[i]=p;else e.lp=p;break;
    case'circle':if(i===0)e.c=p;else e.r=Math.max(1,dist(e.c,p));break;
    case'arc':if(i===0)e.c=p;else if(i===1)e.a0=ang(e.c,p);else e.a1=ang(e.c,p);break;
    case'dim':if(i===0)e.a=p;else if(i===1)e.b=p;else e.off=dot(sub(p,e.a),perp(dimU(e)));break;
    case'text':e.p=p;break;
    case'block':{if(i===0){e.p=p;break}const f=blockXf(o),q=toLocal(o,p),MIN=50,cut=BLOCKS[o.b]&&BLOCKS[o.b].cut;
      if(cut){if(i===1){const w=Math.max(MIN,q.x+o.w/2);e.w=w;e.p=f(V(-o.w/2+w/2,0))}else{const w=Math.max(MIN,o.w/2-q.x);e.w=w;e.p=f(V(o.w/2-w/2,0))}break}

  }}
const isRotGrip=g=>g.e.type==='block'&&g.i===4&&!(BLOCKS[g.e.b]&&BLOCKS[g.e.b].cut);

function hatchLayer(){if(!doc.layers.find(l=>l.id==='hatch'))doc.layers.splice(1,0,{id:'hatch',name:'Hatch',color:'#6b7280',vis:true,lock:false});return'hatch'}
function curHatch(){const p=own(PATS,S.hPat||'')?S.hPat:'diag',F={p,c:HEX.test(S.hCol||'')?S.hCol:'#8a8f98',s:S.hS>0?S.hS:defHatchS(p,false)};if(S.hA)F.a=S.hA;return F}
function hatchReadBar(){const si=$('#hS'),ai=$('#hA'),ci=$('#hC');if(si){const v=parseLen(si.value);S.hS=si.value.trim()&&v>0?v:0}if(ai){const a=+ai.value;S.hA=ai.value.trim()&&isFinite(a)?((a%360)+360)%360:0}if(ci&&HEX.test(ci.value))S.hCol=ci.value;saveSoon()}
function rdp(P,eps){if(P.length<3)return P;let dm=0,ix=0;const a=P[0],b=P[P.length-1];for(let i=1;i<P.length-1;i++){const d=distSeg(P[i],a,b);if(d>dm){dm=d;ix=i}}if(dm<=eps)return[a,b];const l=rdp(P.slice(0,ix+1),eps),r=rdp(P.slice(ix),eps);return l.slice(0,-1).concat(r)}
function detectRegion(q){
  const vb=visibleBox(),bw=vb.x1-vb.x0,bh=vb.y1-vb.y0,k=1600/Math.max(bw,bh),cw=Math.ceil(bw*k)+3,ch=Math.ceil(bh*k)+3;
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const g=c.getContext('2d',{willReadFrequently:true});g.fillStyle='#fff';g.fillRect(0,0,cw,ch);
  const tp=p=>[(p.x-vb.x0)*k+1,(vb.y1-p.y)*k+1];g.fillStyle='#000';g.strokeStyle='#000';g.lineWidth=2.2;g.lineCap='round';g.lineJoin='round';
  const poly=(P,fill)=>{g.beginPath();P.forEach((p,i)=>{const[x,y]=tp(p);i?g.lineTo(x,y):g.moveTo(x,y)});g.closePath();if(fill)g.fill();g.stroke()};
  const corners=[];
  for(const qd of wallData().quads){if(!lvis(qd.w.layer))continue;poly(qd.pts,true);corners.push(...qd.pts)}
  for(const e of doc.ents){if(!lvis(e.layer)||e.type==='wall'||e.type==='dim'||e.type==='text'||e.type==='room')continue;if(e.type==='pline'&&e.layer==='hatch')continue;
    if(e.type==='block'){const B=BLOCKS[e.b];if(!B||!B.cut)continue;const f=blockXf(e),w=e.w/2,d=(e.d||doc.set.wallT)/2;poly([V(-w,-d),V(w,-d),V(w,d),V(-w,d)].map(f),true);continue}
    for(const pr of prims(e)){g.beginPath();if(pr.k==='L'){const[a,b]=tp(pr.a),[c2,d2]=tp(pr.b);g.moveTo(a,b);g.lineTo(c2,d2);corners.push(pr.a,pr.b)}else if(pr.k==='P'){pr.pts.forEach((p,i)=>{const[x,y]=tp(p);i?g.lineTo(x,y):g.moveTo(x,y)});if(pr.closed)g.closePath();corners.push(...pr.pts)}else if(pr.k==='C'){const[x,y]=tp(pr.c);g.arc(x,y,pr.r*k,0,TAU)}else if(pr.k==='A'){const[x,y]=tp(pr.c);g.arc(x,y,pr.r*k,-pr.a0,-pr.a1,true)}else continue;g.stroke()}}
  const[sx,sy]=tp(q).map(Math.round);if(sx<1||sy<1||sx>=cw-1||sy>=ch-1)return{err:'Tap inside the area you see on screen'};
  const D=g.getImageData(0,0,cw,ch).data,m=new Uint8Array(cw*ch),white=i=>D[i*4]>140;
  if(!white(sy*cw+sx))return{err:'You tapped on a line. Tap inside the empty area'};
  const stack=[sx,sy];let n=0,edge=false;m[sy*cw+sx]=1;
  while(stack.length){const y=stack.pop(),x=stack.pop();n++;if(x===0||y===0||x===cw-1||y===ch-1){edge=true;break}
    const t=[x+1,y,x-1,y,x,y+1,x,y-1];for(let i=0;i<8;i+=2){const xx=t[i],yy=t[i+1],id=yy*cw+xx;if(!m[id]&&white(id)){m[id]=1;stack.push(xx,yy)}}}
  if(edge)return{err:'This area isn’t closed on screen. Zoom out so the whole room is visible, or close the gap (doorways count as closed)'};
  if(n<30)return{err:'The area is too small at this zoom. Zoom in and tap again'};
  // boundary edges -> loops
  const at=(x,y)=>x>=0&&y>=0&&x<cw&&y<ch&&m[y*cw+x]===1,next=new Map(),key=(x,y)=>y*(cw+2)+x;
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){if(!m[y*cw+x])continue;
    if(!at(x,y-1))next.set(key(x,y),[x+1,y]);if(!at(x+1,y))next.set(key(x+1,y),[x+1,y+1]);if(!at(x,y+1))next.set(key(x+1,y+1),[x,y+1]);if(!at(x-1,y))next.set(key(x,y+1),[x,y])}
  let best=null,ba=0;const seen=new Set();
  for(const[k0]of next){if(seen.has(k0))continue;const L=[];let kk=k0,guard=0;while(!seen.has(kk)&&guard++<2e6){seen.add(kk);const nx=next.get(kk);if(!nx)break;L.push(nx);kk=key(nx[0],nx[1])}
    if(L.length>3){const a=Math.abs(polyArea(L.map(([x,y])=>V(x,y))));if(a>ba){ba=a;best=L}}}
  if(!best)return{err:'Couldn’t find the boundary'};
  let P=best.map(([x,y])=>V((x-1)/k+vb.x0,vb.y1-(y-1)/k));P=rdp(P.concat([P[0]]),1.3/k).slice(0,-1);
  const tol=3.5/k;P=P.map(p=>{let bp=p,bd=tol;for(const c2 of corners){const d=dist(p,c2);if(d<bd){bd=d;bp=c2}}return bp});
  const out=[];for(const p of P){if(!out.length||dist(out[out.length-1],p)>1e-6)out.push(p)}if(out.length>2&&dist(out[0],out[out.length-1])<1e-6)out.pop();
  if(out.length<3)return{err:'Couldn’t find the boundary'};return{pts:out}}
defTool('hatch',{label:'Hatch',icon:'hatch',draw:true,
  prompt(){return st.hm==='draw'?(st.pts.length?'DRAW AREA · tap the next corner · Close when done':'DRAW AREA · tap the first corner of the area to hatch'):'HATCH · pick a pattern, then tap inside a room or closed area, or on a wall'},
  base(){return st.hm==='draw'&&st.pts.length?st.pts[st.pts.length-1]:null},
  click(p,raw){hatchReadBar();const F=curHatch();
    if(st.hm==='draw'){if(st.pts.length>=3&&dist(p,st.pts[0])<1)return this.act('hclose');if(st.pts.length&&dist(p,st.pts[st.pts.length-1])<1)return;st.pts.push(p);refreshUI();return}
    const q=raw||p,tol=8/view.z;
    const w=pickEnt(q,e=>e.type==='wall');if(w&&distSeg(q,w.a,w.b)<=w.t/2+tol){commit();w.fill=Object.assign({},F,{s:S.hS>0?S.hS:defHatchS(F.p,true)});changed();toast('Wall hatched: '+PATS[F.p],1600);return}
    let best=null,ba=Infinity;for(const e of doc.ents){if(!lvis(e.layer)||llock(e.layer)||e.type==='wall'||!fillable(e))continue;const inside=e.type==='circle'?dist(q,e.c)<e.r:inPoly(q,e.pts);if(!inside)continue;const a=e.type==='circle'?Math.PI*e.r*e.r:Math.abs(polyArea(e.pts));if(a<ba){ba=a;best=e}}
    if(best){commit();best.fill=Object.assign({},F);changed();toast((best.layer==='hatch'?'Hatch changed: ':best.type==='room'?'Room hatched: ':'Shape hatched: ')+PATS[F.p],1600);return}
    const r=detectRegion(q);if(r.err){toast(r.err,3600);return}
    commit();addEnt({type:'pline',closed:true,pts:r.pts,fill:Object.assign({},F),layer:hatchLayer()});changed();toast('Area hatched: '+PATS[F.p]+' · '+fmtArea(Math.abs(polyArea(r.pts))),2200)},
  preview(g){if(st.hm==='draw'&&st.pts.length){const P=cursor?st.pts.concat([cursor.p]):st.pts;g.poly(P,P.length>2)}},
  bar(){const F=curHatch(),pats=Object.keys(PATS).filter(k=>k!=='none');
    return row(...pats.map(k=>btn('hpat',`<img src="${patSwatch(k)}" alt="">${PATSHORT[k]}`,F.p===k?'on':'',`data-v="${k}" title="${esc(PATS[k])}"`)))+
      row(`<input type="color" id="hC" class="sw" value="${esc(F.c)}" title="Hatch color">`,`<input id="hS" class="num" placeholder="Size ${esc(fmtShort(defHatchS(F.p,false)))}" value="${S.hS>0?esc(fmtLenU(S.hS)):''}" title="Pattern size">`,`<input id="hA" class="ang" inputmode="decimal" placeholder="∠°" value="${S.hA||''}" title="Pattern angle">`,btn('hall','All walls'))+
      row(btn('hpick','Tap inside',st.hm!=='draw'?'on':''),btn('hdraw','Draw area',st.hm==='draw'?'on':''),st.hm==='draw'&&st.pts.length>2?btn('hclose','Close','pri'):'',st.hm==='draw'&&st.pts.length?btn('hback','Undo point'):'',DONE())},
  act(a,el){if(a==='hpat'){const v=el.dataset.v;if(own(PATS,v)){hatchReadBar();if(S.hPat!==v)S.hS=0;S.hPat=v;saveSoon();refreshUI()}}
    else if(a==='hpick'){st.hm='pick';st.pts=[];refreshUI();render()}
    else if(a==='hdraw'){st.hm='draw';st.pts=[];refreshUI();render()}
    else if(a==='hback'){st.pts.pop();refreshUI();render()}
    else if(a==='hclose'){if(st.pts.length<3)return;hatchReadBar();commit();addEnt({type:'pline',closed:true,pts:st.pts.slice(),fill:Object.assign({},curHatch()),layer:hatchLayer()});changed();toast('Area hatched: '+PATS[curHatch().p],1600);st.pts=[];refreshUI()}
    else if(a==='hall'){hatchReadBar();const F=curHatch();commit();doc.set.wallPat=F.p;doc.set.hatchS=S.hS>0?S.hS:0;doc.set.fill=F.c;doc.ents.forEach(e=>{if(e.type==='wall')delete e.fill});changed();toast('All walls: '+PATS[F.p]+' (Settings › Default wall style)',2200)}
    else if(a==='done'){finish()}}});

defTool('dim',{label:'Dimension',icon:'dim',draw:true,base(){return st.pts.length===1?st.pts[0]:null},
  mode(){return S.dimMode==='aligned'?'aligned':'linear'},
  prompt(){const m=this.mode()==='aligned'?'ALIGNED':'LINEAR';return m+' · '+['Tap the first point to measure','Tap the second point',this.mode()==='aligned'?'Tap where to place the dimension line':'Drag up/down for a horizontal size, left/right for a vertical size, then tap'][st.pts.length]},
  mk(a,b,c){if(this.mode()==='aligned'){const n=perp(nrm(sub(b,a)));return{type:'dim',a,b,off:dot(sub(c,a),n),layer:'dims'}}
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=Math.abs(c.x-mx)-Math.abs(b.x-a.x)/2,dy=Math.abs(c.y-my)-Math.abs(b.y-a.y)/2;
    let vert=dx>dy;if(vert&&Math.abs(b.y-a.y)<1)vert=false;else if(!vert&&Math.abs(b.x-a.x)<1)vert=true;
    const av=vert?Math.PI/2:0;return{type:'dim',a,b,ang:av,off:dot(sub(c,a),perp(V(Math.cos(av),Math.sin(av)))),layer:'dims'}},
  click(p){st.pts.push(p);if(st.pts.length===2&&dist(st.pts[0],st.pts[1])<1){st.pts.pop();return}
    if(st.pts.length===3){const[a,b,c]=st.pts;commit();addEnt(this.mk(a,b,c));changed();st.pts=[]}refreshUI()},
  preview(g){const p=st.pts;if(!cursor)return;if(p.length===1)g.line(p[0],cursor.p,true);if(p.length===2)g.prims(dimPrims(this.mk(p[0],p[1],cursor.p)))},
  info(){if(st.pts.length===2&&cursor){const d=this.mk(st.pts[0],st.pts[1],cursor.p);return(d.ang==null?'Aligned ':d.ang?'Vertical ':'Horizontal ')+fmtLenU(dimGeo(d).L)}},
  bar(){const m=this.mode(),a=doc.set.dimArr||'tick';
    return row(btn('mlin','Linear (H/V)',m==='linear'?'on':''),btn('mali','Aligned',m==='aligned'?'on':''),st.pts.length?btn('back','Undo point'):'',DONE())+
      row(`<span class="cnt">Arrows</span>`,...Object.keys(ARROWS).map(k=>btn('arr',{tick:'⟋ Tick',arrow:'◀ Arrow',open:'< Open',dot:'● Dot'}[k],a===k?'on':'',`data-v="${k}"`)))},
  act(a,el){if(a==='back'){st.pts.pop();refreshUI()}else if(a==='done')finish();
    else if(a==='mlin'||a==='mali'){S.dimMode=a==='mali'?'aligned':'linear';saveSoon();refreshUI();render()}

const isLin=e=>e.type==='line'||e.type==='wall';
function offsetPoly(pts,closed,d){const n=pts.length,m=closed?n:n-1,segs=[];for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%n],o=mul(perp(nrm(sub(b,a))),d);segs.push([add(a,o),add(b,o)])}

    if(isLin(e)){const n=perp(nrm(sub(e.b,e.a))),sg=Math.sign(dot(sub(raw,e.a),n))||1,v=mul(n,d*sg);c.a=add(e.a,v);c.b=add(e.b,v)}

function cutters(ex,wallMode){const segs=[],circs=[];for(const e of doc.ents){if(e===ex||!lvis(e.layer))continue;
  if(e.type==='line')segs.push([e.a,e.b]);else if(e.type==='wall'){segs.push([e.a,e.b]);if(!wallMode)wallQuadsFor(e).forEach(q=>{for(let i=0;i<4;i++)segs.push([q.pts[i],q.pts[(i+1)%4]])})}
  else if(e.type==='pline'){const p=e.pts;for(let i=0;i<p.length-1;i++)segs.push([p[i],p[i+1]]);if(e.closed)segs.push([p[p.length-1],p[0]])}
  else if(e.type==='circle')circs.push({c:e.c,r:e.r,full:true});else if(e.type==='arc')circs.push({c:e.c,r:e.r,a0:e.a0,a1:e.a1})}return{segs,circs}}
function segHits(a,b,cut,ray){const ts=[];const ok=t=>ray?t>1+1e-6:t>1e-6&&t<1-1e-6;
  for(const[c,d]of cut.segs){const X=lineInt(a,b,c,d);if(X&&X.u>=-1e-6&&X.u<=1+1e-6&&ok(X.t))ts.push(X.t)}
  for(const C of cut.circs)for(const t of lineCircle(a,b,C.c,C.r)){if(!ok(t))continue;const p=lerp(a,b,t);if(C.full||angIn(ang(C.c,p),C.a0,C.a1))ts.push(t)}return ts.sort((x,y)=>x-y)}
function circHits(e,cut){const as=[];for(const[c,d]of cut.segs)for(const t of lineCircle(c,d,e.c,e.r)){if(t>=-1e-6&&t<=1+1e-6)as.push(normA(ang(e.c,lerp(c,d,t))))}return as}
function explodeTo(e){const out=[];if(e.type==='pline'||e.type==='room'){const p=e.pts,cl=e.closed||e.type==='room';for(let i=0;i<p.length-(cl?0:1);i++)out.push({type:'line',a:p[i],b:p[(i+1)%p.length],layer:e.layer})}
  else if(e.type==='wall'){wallQuadsFor(e).forEach(q=>{out.push({type:'line',a:q.pts[0],b:q.pts[1],layer:e.layer},{type:'line',a:q.pts[3],b:q.pts[2],layer:e.layer},{type:'line',a:q.pts[1],b:q.pts[2],layer:e.layer},{type:'line',a:q.pts[3],b:q.pts[0],layer:e.layer})})}
  else for(const pr of prims(e)){if(pr.k==='L')out.push({type:'line',a:pr.a,b:pr.b,layer:e.layer});else if(pr.k==='P')out.push({type:'pline',pts:pr.pts,closed:pr.closed,layer:e.layer});else if(pr.k==='C')out.push({type:'circle',c:pr.c,r:pr.r,layer:e.layer});else if(pr.k==='A')out.push({type:'arc',c:pr.c,r:pr.r,a0:pr.a0,a1:pr.a1,layer:e.layer});else if(pr.k==='T')out.push({type:'text',p:pr.al==='c'?rotP(add(pr.p,V(-textW(pr.s,pr.h,pr.b)/2,pr.v==='m'?-pr.h*0.35:0)),pr.p,pr.rot||0):pr.p,s:pr.s,h:pr.h,rot:pr.rot||0,layer:e.layer})}
  out.forEach(o=>{if(e.color)o.color=e.color;if(e.lw)o.lw=e.lw;if(e.lt)o.lt=e.lt});return clone(out)}
function trimAt(e,p){
  if(e.type==='pline'){const parts=explodeTo(e);removeEnt(e);let best=null,bd=Infinity;for(const c of parts){const n=addEnt(c);const d=distSeg(p,n.a,n.b);if(d<bd){bd=d;best=n}}invalidate();return trimAt(best,p)}
  const cut=cutters(e,e.type==='wall');
  if(isLin(e)){const A0=e.a,B0=e.b,ts=segHits(A0,B0,cut),tp=segT(p,A0,B0);let t0=null,t1=null;for(const t of ts){if(t<tp)t0=t;else if(t1===null)t1=t}
    if(t0===null&&t1===null)removeEnt(e);else if(t0===null)e.a=lerp(A0,B0,t1);else if(t1===null)e.b=lerp(A0,B0,t0);else{const e2=clone(e);e.b=lerp(A0,B0,t0);e2.a=lerp(A0,B0,t1);addEnt(e2)}return true}
  if(e.type==='circle'){const as=circHits(e,cut).sort((a,b)=>a-b);if(as.length<2){removeEnt(e);return true}const ap=normA(ang(e.c,p));let i=as.findIndex(a=>a>ap);if(i<0)i=0;const hi=as[i],lo=as[(i-1+as.length)%as.length];e.type='arc';e.a0=hi;e.a1=lo;delete e.c0;return true}
  if(e.type==='arc'){const sw=normA(e.a1-e.a0),u=a=>normA(a-e.a0)/sw;const us=circHits(e,cut).map(u).filter(x=>x>1e-6&&x<1-1e-6).sort((a,b)=>a-b),up=u(ang(e.c,p));let u0=null,u1=null;for(const x of us){if(x<up)u0=x;else if(u1===null)u1=x}
    const at=x=>e.a0+x*sw;if(u0===null&&u1===null)removeEnt(e);else if(u0===null)e.a0=at(u1);else if(u1===null)e.a1=at(u0);else{const e2=clone(e);e.a1=at(u0);e2.a0=at(u1);addEnt(e2)}return true}
  return false}

const TABS={Draw:['wall','line','pline','rect','circle','arc','hatch'],Blocks:BLOCK_ORDER,Modify:['move','copy','rotate','mirror','scale','offset','trim','extend','corner','explode','delete','props'],Annotate:['dim','text','room','hatch','measure']};

const thumbs={};
function blockThumb(k){if(thumbs[k])return thumbs[k];const B=BLOCKS[k],c=document.createElement('canvas');c.width=c.height=56;const g=c.getContext('2d');const w=B.w,d=B.d||(B.cut?230:B.w);let P=B.draw(w,d);if(B.cut)P=[R(-w/2-w*0.2,-d/2,-w/2,d/2),R(w/2,-d/2,w/2+w*0.2,d/2)].concat(P);const bb=primsBBox(P);const s=46/Math.max(bb.x1-bb.x0,bb.y1-bb.y0,1);g.translate(28,28);g.strokeStyle='#dfe3e8';g.fillStyle='#dfe3e8';g.lineWidth=2;
  const tp=p=>V((p.x-(bb.x0+bb.x1)/2)*s,-(p.y-(bb.y0+bb.y1)/2)*s);for(const pr of P){g.beginPath();if(pr.k==='L'){const a=tp(pr.a),b=tp(pr.b);g.moveTo(a.x,a.y);g.lineTo(b.x,b.y)}else if(pr.k==='P'){pr.pts.map(tp).forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));if(pr.closed)g.closePath()}else if(pr.k==='C'){const c=tp(pr.c);g.arc(c.x,c.y,pr.r*s,0,TAU)}else if(pr.k==='A'){const c=tp(pr.c);g.arc(c.x,c.y,pr.r*s,-pr.a0,-pr.a1,true)}else if(pr.k==='T'){const c=tp(pr.p);g.font='bold '+Math.max(8,pr.h*s)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(pr.s,c.x,c.y)}g.stroke()}
  return thumbs[k]=c.toDataURL()}
function renderTabs(){const side=S.dock==='l'||S.dock==='r',mn=!!S.rbMin;$('#tabs').innerHTML=`<button class="tx grip" id="dockGrip" title="Tap to choose, or drag to move the tool panel (left, right or bottom)" aria-label="Move tool panel">⠿</button>`+Object.keys(TABS).map(t=>`<button class="${t===tab&&!mn?'on':''}" data-tab="${t}">${t}</button>`).join('')+(side?`<button class="tx" data-dock="b" title="Move the tools back to the bottom" aria-label="Move tools to the bottom">${icon('dockb')}</button>`:'')+`<button class="tx" data-rbmin="1" title="${mn?'Show tools':'Hide tools for more drawing space'}" aria-label="${mn?'Show tools':'Hide tools'}">${mn?(side?'▸':'▴'):(side?'◂':'▾')}</button>`;
  const items=TABS[tab].map(k=>{if(tab==='Blocks')return`<button class="tb ${T.name==='place'&&st.b===k?'on':''}" data-block="${k}" title="${esc(BLOCKS[k].name)}"><img src="${blockThumb(k)}" alt="">${esc(BLOCKS[k].name)}</button>`;if(k==='props')return`<button class="tb" data-tool="props" title="Properties">${icon('props')}Properties</button>`;const t=TOOLS[k];return`<button class="tb ${T.name===k?'on':''}" data-tool="${k}" title="${esc(t.label)}">${icon(t.icon)}${t.label}</button>`});
  $('#tools').innerHTML=`<button class="tb ${T.name==='select'?'on':''}" data-tool="select" title="Select">${icon('select')}Select</button><span class="tb sep"></span>`+items.join('')}

function openHelp(){openSheet('How to use',`<ol style="padding-left:18px;margin:0">
<li><b>Draw walls:</b> Draw › Wall. Tap the start point, then tap each corner. Or type a length (<kbd>12 6</kbd> = 12'-6", <kbd>10</kbd> = 10') and tap an arrow → ↑ ← ↓. Tap <b>Close</b> to finish a room loop.</li>
<li><b>Snaps:</b> SNAP locks to corners, midpoints and intersections. GRID locks to the grid. ORTHO keeps lines straight (horizontal or vertical).</li>
<li><b>Doors and windows:</b> Blocks › Door or Window, then tap on a wall. They cut the wall automatically. Use Flip to change the swing.</li>
<li><b>3D view:</b> tap <b>3D</b> at the top, then choose <b>Whole drawing</b>, <b>Pick an area on the plan</b> (tap two corners of a box; walls are cut at the box edge) or <b>Selected items</b> (select walls first; their doors and windows come along). In 3D, the <b>ALL / PART</b> button switches between them. ORBIT: drag to turn, pinch to zoom, two fingers to move. TOP looks straight down. CUT lowers the walls so you can see inside. WALK: drag to look around and hold ▲ ▼ to walk through the rooms (W A S D on a PC). The ⚙ button sets wall, door and window heights and the plinth, saves a picture, or exports a 3D file (OBJ) for Blender or SketchUp.</li>
<li><b>Hatch:</b> Draw › Hatch (also in Annotate). Pick a pattern, then tap inside a room, a closed shape or an area closed by walls. The app finds the boundary itself. Tap a wall to hatch the wall. <b>Draw area</b> lets you tap the corners of any shape. Set the color, size and angle (∠) in the bar. Change an existing hatch with Properties.</li>
<li><b>More drawing space:</b> tap ▾ on the tool tabs to hide the tools. Tap any tab to bring them back. Tap the ⠿ handle to put the tools on the Left, Bottom or Right, or drag it to an edge. At the side, the panel is thin and shows icons only (hover to see names on a PC). The bottom-bar icon under the tabs moves it back to the bottom.</li>
<li><b>Wall size:</b> with <b>Outside face</b> (the default) the points you tap or type are the outside of the wall and the thickness goes inside, so 27 × 50 gives a building exactly 27' × 50' outside. Choose <b>Centre</b> to draw along the middle of the wall. <b>⇄ Flip</b> moves the wall to the other side of your line. <b>Room box…</b> makes 4 walls from a typed outside size, like 27 x 50.</li>
<li><b>Crosshair (like AutoCAD):</b> while drawing, the crosshair stays on screen. Drag near it to move it (it snaps to corners), then tap the black <b>Tap</b> button to place the point. A quick tap anywhere places a point straight away. Drag away from the crosshair to pan. You can switch back to the simple cursor in Settings.</li>
<li><b>Length and angle boxes:</b> while drawing, boxes show the length and angle next to the crosshair, like AutoCAD. Tap a box (⌨) to type a value, then Enter. The angle is measured from the horizontal on the side your crosshair is on. On a PC just start typing numbers. Turn the boxes off in Settings.</li>
<li><b>Pan and zoom:</b> drag with one finger to pan, pinch to zoom. A quick tap places a point. <b>Hold your finger still</b> for a moment to get a precise crosshair above your finger, slide to aim, and lift to place.</li>
<li><b>Select:</b> tap objects one by one to add them (tap again to remove). For many at once, tap <b>▭ Box select</b> and drag a rectangle: left→right picks objects fully inside, right→left picks anything it touches. You can also hold your finger, then drag. <b>+ Similar</b> adds every object of the same kind (all walls, all doors…), and there's also Select all. Drag the blue squares to stretch or move.</li>
<li><b>Modify:</b> Move, Copy, Rotate, Mirror, Scale, Offset, Trim, Extend, Corner (joins two walls at a corner), Explode, Delete.</li>
<li><b>Annotate:</b> Dimension (tap 2 points, then where the line goes). Pick <b>Linear (H/V)</b> for a horizontal or vertical size, or <b>Aligned</b> to measure along a slanted wall. Pick the arrows: Tick, Arrow, Open or Dot. Text, Room (tap 2 corners for a rectangle, then Done: shows name and size), Measure.</li>
<li><b>Layers:</b> the stack button at the top. Hide, lock or recolor groups like furniture or dimensions.</li>
<li><b>PDF:</b> the export button at the top. Pick paper size and scale, then save or share.</li>
<li><b>AutoCAD:</b> Menu › Export DXF (AutoCAD). The file opens in AutoCAD, BricsCAD, DraftSight, LibreCAD and ZWCAD with your layers, colours, line types, real hatches, real dimensions and doors and furniture as blocks. To get a DWG, open the DXF in AutoCAD and Save As DWG.</li>
<li><b>Updates:</b> when a new version is out, a blue <b>Update</b> bar appears at the bottom. Tap it to update. Your plans stay safe. You can also use Menu › Check for updates.</li></ol>
<div class="hint">Keyboard: Esc cancel · Enter done · Delete · Ctrl+Z undo · F8 ortho.</div>`)}

async function saveFile(name,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  let framed=false;try{framed=window.top!==window.self}catch(e){framed=true}
  const dl=framed?(DL||(toast('Preparing '+name+'…',8000),await getDL())):null;
  if(dl){try{const r=await dl.save({filename:name,data:blob});toast(r&&r.status==='delivered'?'Sent '+name:'Saved '+name,2500);return}catch(e){const c=e&&e.code;if(c==='declined')return toast('Save cancelled');if(c==='rate_limited')return toast('Please wait a moment and try again');DLerr=String(c||(e&&e.message)||e)}}
  if(framed){openSheet('Can’t save here',`<p>This view of WallCAD isn’t allowed to save files, so the ${esc(name.split('.').pop().toUpperCase())} couldn’t be saved.</p><p>To save and share PDFs:</p><ol style="padding-left:18px"><li>Open the WallCAD link while <b>signed in to Claude</b> (Claude app or claude.ai), or</li><li>Use the <b>WallCAD website link</b> (the one added to your home screen) or the offline WallCAD.html file in Chrome. Saving and the share menu always work there.</li></ol><div class="hint">Your drawing is safe on this device. Nothing was lost.${DLerr?' (Reason: '+esc(DLerr)+')':''}</div><div class="row" style="margin-top:12px"><button type="button" class="b pri" id="retrySave">Try again</button></div>`,sh=>{sh.querySelector('#retrySave').onclick=()=>{closeSheet();saveFile(name,blob,mime)}});return}
  try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});toast('Shared '+name);return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);toast('Download started: '+name+' · check your Downloads folder',3000)}catch(e){toast('This view can’t save files')}}

$('#fileIn').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>30*1024*1024){ev.target.value='';return toast('That file is too big to be a WallCAD backup')}const r=new FileReader();r.onload=()=>{try{const d=sanitizeDoc(JSON.parse(r.result));d.id=newDoc().id;saveDoc();loadDoc(d);saveSoon();toast('Restored “'+d.name+'” · '+d.ents.length+' objects')}catch(e){toast('That isn’t a WallCAD backup file')}};r.readAsText(f);ev.target.value=''});

/* PDF */
const PAPERS={A4:[210,297],A3:[297,420],A2:[420,594],Letter:[215.9,279.4]};
const SCALES_M=[1,2,5,10,20,25,50,75,100,125,150,200,250,300,400,500,750,1000,1250,1500,2000,2500,5000];
const SCALES_FT=[[12,'1" = 1\'-0"'],[16,'3/4" = 1\'-0"'],[24,'1/2" = 1\'-0"'],[32,'3/8" = 1\'-0"'],[48,'1/4" = 1\'-0"'],[64,'3/16" = 1\'-0"'],[96,'1/8" = 1\'-0"'],[128,'3/32" = 1\'-0"'],[192,'1/16" = 1\'-0"'],[384,'1/32" = 1\'-0"'],[768,'1/64" = 1\'-0"']];
const scaleList=()=>isFt()?SCALES_FT:SCALES_M.map(s=>[s,'1:'+s]);
const scaleLabel=s=>{const f=scaleList().find(x=>x[0]===s);return f?f[1]:'1:'+Math.round(s)};
function pdfLayout(o){let[pw,ph]=PAPERS[o.paper]||PAPERS.A4;if(o.orient==='landscape')[pw,ph]=[ph,pw];const M=10,TB=17;const area={x:M,y:M+TB,w:pw-2*M,h:ph-2*M-TB};const bb=o.areaMode==='screen'?visibleBox():o.areaMode==='pick'&&printArea?Object.assign({},printArea):extents();if(!bb||!(bb.x1-bb.x0>1)||!(bb.y1-bb.y0>1))return null;
  const bw=bb.x1-bb.x0,bh=bb.y1-bb.y0,need=Math.max(bw/(area.w-12),bh/(area.h-12));let S0=+o.scale;if(o.scale==='fit'||!S0){const l=scaleList();S0=(l.find(x=>x[0]>=need)||l[l.length-1])[0];if(need>S0)S0=need}return{pw,ph,M,TB,area,bb,S:S0,fits:need<=S0+1e-9,win:o.areaMode==='screen'||o.areaMode==='pick'}}
function buildPDF(o){
  const Lp=pdfLayout(o);if(!Lp)return null;const{pw,ph,M,TB,area,bb,S,win}=Lp;const k=72/25.4;const ccx=(bb.x0+bb.x1)/2,ccy=(bb.y0+bb.y1)/2;
  const X=x=>((area.x+area.w/2)+(x-ccx)/S)*k,Y=y=>((area.y+area.h/2)+(y-ccy)/S)*k;const f=n=>(Math.round(n*100)/100).toFixed(2).replace(/\.?0+$/,'')||'0';
  const out=[];const rgb=h=>{const n=parseInt((h||'#000').slice(1),16);return[(n>>16)/255,((n>>8)&255)/255,(n&255)/255].map(v=>f(v)).join(' ')};
  const sc=h=>o.mono?'0 0 0':rgb(lum(h)>0.8?'#000000':h);
  const frgb=h=>{if(!o.mono)return rgb(h);const g=f(0.55+0.45*lum(h));return g+' '+g+' '+g};
  const pp=p=>f(X(p.x))+' '+f(Y(p.y));
  const pstr=s=>'('+Array.from(String(s)).map(ch=>{const c=ch.charCodeAt(0);if(ch==='\\'||ch==='('||ch===')')return'\\'+ch;return c<256&&c>=32?ch:'?'}).join('')+')';
  function arcPath(c,r,a0,a1,first){let sw=normA(a1-a0);if(sw<1e-9)sw=TAU;const n=Math.ceil(sw/(Math.PI/2)),d=sw/n,kk=4/3*Math.tan(d/4);let a=a0;const s=polar(c,r,a);let o2=(first?pp(s)+' m\n':'');for(let i=0;i<n;i++){const b=a+d,p0=polar(c,r,a),p3=polar(c,r,b),p1=add(p0,mul(V(-Math.sin(a),Math.cos(a)),r*kk)),p2=sub(p3,mul(V(-Math.sin(b),Math.cos(b)),r*kk));o2+=pp(p1)+' '+pp(p2)+' '+pp(p3)+' c\n';a=b}return o2}
  function pathOf(pr){if(pr.k==='L')return pp(pr.a)+' m '+pp(pr.b)+' l\n';if(pr.k==='P'){if(!pr.pts.length)return'';return pr.pts.map((p,i)=>pp(p)+(i?' l':' m')).join(' ')+(pr.closed?' h':'')+'\n'}if(pr.k==='C')return arcPath(pr.c,pr.r,0,TAU,true)+'h\n';if(pr.k==='A')return arcPath(pr.c,pr.r,pr.a0,pr.a1,true);return''}
  function textOp(pr,col,bold){const sz=pr.h/S*k;if(sz<0.8)return'';const w=textW(pr.s,pr.h,pr.b)/S*k;let dx=pr.al==='c'?-w/2:0,dy=pr.v==='m'?-sz*0.35:0;const r=pr.rot||0,c=Math.cos(r),s=Math.sin(r);const x=X(pr.p.x)+dx*c-dy*s,y=Y(pr.p.y)+dx*s+dy*c;return`BT /${pr.b||bold?'F2':'F1'} ${f(sz)} Tf ${sc(col)} rg ${f(c)} ${f(s)} ${f(-s)} ${f(c)} ${f(x)} ${f(y)} Tm ${pstr(pr.s)} Tj ET\n`}
  out.push('1 J 1 j');
  let cx0=area.x*k,cy0=area.y*k,cx1=(area.x+area.w)*k,cy1=(area.y+area.h)*k;
  if(win){cx0=Math.max(cx0,X(bb.x0));cy0=Math.max(cy0,Y(bb.y0));cx1=Math.min(cx1,X(bb.x1));cy1=Math.min(cy1,Y(bb.y1))}
  out.push(`q ${f(cx0)} ${f(cy0)} ${f(cx1-cx0)} ${f(cy1-cy0)} re W n`);
  const inWin=b=>!win||bbHit(b,bb);
  const wd=wallData(),vq=wd.quads.filter(q=>lvis(q.w.layer)&&inWin(entBBox(q.w)));
  const polyPath=P=>P.map(p=>pathOf({k:'P',pts:p,closed:true})).join('');
  const fillOp=(polys,F,white)=>{const path=polyPath(polys);if(!path)return'';if(F.p==='solid')return frgb(F.c)+' rg\n'+path+'f\n';let acc=white?'1 1 1 rg\n'+path+'f\n':'';if(F.p==='none')return acc;const segs=hatchSegs(polysBB(polys),F.p,F.s,F.a);if(!segs.length)return acc;return acc+'q\n'+path+'W n\n0.25 w [] 0 d '+(o.mono?'0 0 0':rgb(F.c))+' RG\n'+segs.map(([a,b])=>pp(a)+' m '+pp(b)+' l').join('\n')+'\nS\nQ\n'};
  for(const e of doc.ents){if(e.type==='wall'||!e.fill||!lvis(e.layer)||!inWin(entBBox(e)))continue;out.push(fillOp(fillPolys(e),e.fill,false))}
  if(vq.length){out.push('0 j 0 J');const wg=new Map();vq.forEach(q=>{const k=sc(eCol(q.w))+'|'+(q.w.lw?LWPT[q.w.lw]*2:1.1);if(!wg.has(k))wg.set(k,[]);wg.get(k).push(q)});
    for(const[k,qs]of wg){const[c,w]=k.split('|');out.push(`${w} w ${c} RG\n`+polyPath(qs.map(q=>q.pts))+'S')}
    const byW=new Map();vq.forEach(q=>{if(!byW.has(q.w))byW.set(q.w,[]);byW.get(q.w).push(q.pts)});for(const[w,P]of byW)out.push(fillOp(P,wallFill(w),true));out.push('1 J 1 j')}
  for(const e of doc.ents){if(e.type==='wall'||!lvis(e.layer)||!inWin(entBBox(e)))continue;const P=prims(e),col=eCol(e);const lw=e.lw?LWPT[e.lw]:e.type==='dim'?0.3:e.type==='block'&&BLOCKS[e.b]&&!BLOCKS[e.b].cut?0.4:0.6;const dsh=e.lt?'['+DASHMM[e.lt].map(x=>f(x*k)).join(' ')+'] 0 d':'[] 0 d';let pth='',fp='';for(const pr of P)if(pr.k!=='T'){pth+=pathOf(pr);if(pr.f)fp+=pathOf(pr)+(pr.k==='P'&&!pr.closed?'h\n':'')}if(pth)out.push(`${lw} w ${dsh} ${sc(col)} RG\n${pth}S`);if(fp)out.push(`${sc(col)} rg\n${fp}f`);for(const pr of P)if(pr.k==='T')out.push(textOp(pr,col))}
  out.push('[] 0 d');
  out.push('Q');
  // frame + title block
  const T2=(x,y,s,sz,b,gray)=>`BT /${b?'F2':'F1'} ${f(sz)} Tf ${gray?'0.4 0.4 0.4':'0 0 0'} rg 1 0 0 1 ${f(x*k)} ${f(y*k)} Tm ${pstr(s)} Tj ET`;
  out.push(`0 0 0 RG 0.8 w ${f(M*k)} ${f(M*k)} ${f((pw-2*M)*k)} ${f((ph-2*M)*k)} re S`);out.push(`0.6 w ${f(M*k)} ${f((M+TB)*k)} m ${f((pw-M)*k)} ${f((M+TB)*k)} l S`);
  const cols=[['PROJECT',o.title||doc.name,0.40],['DRAWN BY',o.by||'-',0.18],['DATE',new Date().toLocaleDateString(),0.14],['SCALE',scaleLabel(S),0.17],['UNITS',isFt()?'ft-in':'m',0.11]];let cx=M;const tw2=pw-2*M;
  cols.forEach(([lab,val,fr],i)=>{const w=tw2*fr;if(i)out.push(`0.4 w ${f(cx*k)} ${f(M*k)} m ${f(cx*k)} ${f((M+TB)*k)} l S`);out.push(T2(cx+2.5,M+TB-5.5,lab,5.5,false,true));let v=String(val);const mx=Math.floor((w-5)/(i===0?2.3:2.0));if(v.length>mx)v=v.slice(0,mx-3)+'...';out.push(T2(cx+2.5,M+4.5,v,i===0?11:9,true));cx+=w});
  out.push(T2(pw-M-38,M+TB+2.5,'Drawn with WallCAD',5,false,true));
  const content=out.join('\n');
  const objs=[null,'<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(pw*k)} ${f(ph*k)}] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>`,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
  let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];for(let i=1;i<objs.length;i++){offs[i]=pdf.length;pdf+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
  const xr=pdf.length;pdf+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+offs.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`;
  const u8=new Uint8Array(pdf.length);for(let i=0;i<pdf.length;i++)u8[i]=pdf.charCodeAt(i)&255;return{bytes:u8,S,fits:Lp.fits}}
let printArea=null,expMode='all',expTitle='';
function openExport(){
  if(!doc.ents.length)return toast('Draw something first');const s0=doc.set;
  openSheet('Export PDF',`<div class="row"><select id="eP">${Object.keys(PAPERS).map(p=>`<option ${p===s0.paper?'selected':''}>${p}</option>`).join('')}</select><select id="eO"><option value="landscape" ${s0.orient==='landscape'?'selected':''}>Landscape</option><option value="portrait" ${s0.orient==='portrait'?'selected':''}>Portrait</option></select></div>
   <label>Print colors</label><select id="eM"><option value="0" ${!s0.mono?'selected':''}>Colorful (as drawn)</option><option value="1" ${s0.mono?'selected':''}>Black &amp; white (lines black, fills grey)</option></select>
   <label>What to print</label><select id="eA"><option value="all" ${expMode==='all'?'selected':''}>Whole drawing</option><option value="screen" ${expMode==='screen'?'selected':''}>What's on screen now</option><option value="pick" ${expMode==='pick'?'selected':''}>${printArea?'Picked area ('+esc(fmtShort(printArea.x1-printArea.x0))+' × '+esc(fmtShort(printArea.y1-printArea.y0))+')':'Pick an area on the drawing…'}</option></select>
   ${printArea?`<div class="row" style="margin-top:6px">${btn('repick','Pick a different area')}</div>`:''}
   <label>Scale</label><select id="eS"><option value="fit">Fit to page (best standard scale)</option>${scaleList().map(([v,l])=>`<option value="${v}" ${String(v)===String(s0.scale)?'selected':''}>${esc(l)}</option>`).join('')}</select>
   <div class="hint" id="eInfo"></div>
   <label>Title</label><input id="eT" value="${esc(expTitle||doc.name)}"><label>Drawn by</label><input id="eB" value="${esc(s0.by||'')}">
   <div class="row" style="margin-top:14px">${btn('go',icon('share')+' Save / share PDF','pri')}</div><div class="hint">The PDF is vector, so it stays sharp when zoomed or printed. Hidden layers are left out.</div>`,s=>{
    const val=()=>({areaMode:s.querySelector('#eA').value,paper:s.querySelector('#eP').value,orient:s.querySelector('#eO').value,scale:s.querySelector('#eS').value,title:s.querySelector('#eT').value,by:s.querySelector('#eB').value,mono:s.querySelector('#eM').value==='1'});
    const info=()=>{const L2=pdfLayout(val());s.querySelector('#eInfo').textContent=L2?(L2.fits?`Prints at ${scaleLabel(L2.S)}.`:`Too big for this paper at this scale. Pick a smaller scale or bigger paper.`):''};
    const keep=()=>{const o=val();Object.assign(doc.set,{paper:o.paper,orient:o.orient,scale:o.scale,by:o.by,mono:o.mono});expTitle=o.title;saveSoon()};
    const pick=()=>{keep();closeSheet();setTool('printarea')};
    s.querySelectorAll('select').forEach(x=>x.onchange=info);
    s.querySelector('#eA').onchange=()=>{expMode=s.querySelector('#eA').value;if(expMode==='pick'&&!printArea)return pick();info()};
    const rp=s.querySelector('[data-act=repick]');if(rp)rp.onclick=pick;info();
    s.querySelector('[data-act=go]').onclick=()=>{const o=val();Object.assign(doc.set,{paper:o.paper,orient:o.orient,scale:o.scale,by:o.by,mono:o.mono});saveSoon();const r=buildPDF(o);if(!r)return toast(o.areaMode==='pick'?'Pick an area first':'Nothing to export');closeSheet();saveFile(safeName(o.title)+'.pdf',new Blob([r.bytes],{type:'application/pdf'}),'application/pdf')}})}

  if(!HOSTED){if(manual)openSheet('Check for updates',`<p>You have WallCAD <b>${APP_VERSION}</b>.</p><p>Automatic updates work when WallCAD is opened from its <b>website link</b> (for example the one added to your home screen). This copy was opened ${isFramed?'inside another page':'as a file'}, so it can’t check for updates by itself.</p><div class="hint">Ask the person who shared WallCAD for the website link.</div>`);return}
  if(!navigator.onLine){if(manual)toast('You’re offline · connect to the internet to check for updates',3000);return}

  try{REMOTE=await fetchRemote()}catch(e){if(manual)toast('Couldn’t check for updates right now · try again later',3000);return}

    if('caches' in window){const fresh=await Promise.all(SHELL_FILES.map(async f=>{const r=await fetch(f+(f.includes('?')?'&':'?')+'fresh='+Date.now(),{cache:'reload'});if(!r.ok)throw new Error(f+' '+r.status);return[f,r]}));

function v3ui(){const o=set3();$('#v3bar').innerHTML=`<button class="ib" data-v3="close" aria-label="Close 3D" title="Back to plan">${icon('undo')}</button><b class="v3t">3D view</b>`+
  `<button class="chip ${V3.mode==='orbit'?'on':''}" data-v3="orbit">ORBIT</button><button class="chip ${V3.mode==='walk'?'on':''}" data-v3="walk">WALK</button><button class="chip" data-v3="top">TOP</button><button class="chip ${V3.cut?'on':''}" data-v3="cut">CUT</button><button class="chip ${V3.scope?'on':''}" data-v3="part" title="Whole drawing or a part">${V3.scope?'PART':'ALL'}</button><button class="ib" data-v3="more" aria-label="3D options" title="Options">${icon('props')}</button>`;
  $('#v3pad').style.display=V3.mode==='walk'?'grid':'none';
  $('#v3hint').textContent=V3.mode==='walk'?(touchUI?'Drag to look around · hold the arrows to walk':'Drag to look · W A S D or arrow keys to walk · Shift = faster'):(touchUI?'Drag to turn · pinch to zoom · two fingers to move':'Drag to turn · right-drag or Shift-drag to move · wheel to zoom')}
function v3opts(){const o=set3(),f=v=>esc(fmtLenU(v));openSheet('3D options',`<label>Wall height</label><input id="o3W" value="${f(o.wallH)}"><label>Door height</label><input id="o3D" value="${f(o.doorH)}">
  <label>Window sill height (from floor)</label><input id="o3S" value="${f(o.sillH)}"><label>Window top height</label><input id="o3T" value="${f(o.headH)}"><label>Plinth (floor above ground)</label><input id="o3P" value="${f(o.plinth)}">
  <label>Edges</label><select id="o3E"><option value="1" ${V3.edges!==false?'selected':''}>Show outlines</option><option value="0" ${V3.edges===false?'selected':''}>No outlines</option></select>
  <div class="row" style="margin-top:12px">${btn('ok','Apply','pri')}${btn('img','Save picture')}${btn('obj','Export 3D (OBJ)')}</div><div class="hint">CUT lowers all walls to 1.2 m so you can see inside the rooms from above. OBJ opens in Blender, SketchUp, 3D Viewer and most 3D programs.</div>`,s=>{
  const v=id=>s.querySelector('#'+id).value;s.querySelector('[data-act=ok]').onclick=()=>{const h3={};[['o3W','wallH'],['o3D','doorH'],['o3S','sillH'],['o3T','headH'],['o3P','plinth']].forEach(([i,k])=>{const x=parseLen(v(i));if(x>0||(k==='plinth'&&x===0))h3[k]=x});doc.set.h3=Object.assign({},doc.set.h3||{},h3);V3.edges=v('o3E')==='1';saveSoon();closeSheet();v3rebuild();toast('3D updated',1200)};
  s.querySelector('[data-act=img]').onclick=()=>{closeSheet();v3img()};s.querySelector('[data-act=obj]').onclick=()=>{closeSheet();exportOBJ()}})}
function v3img(){v3draw();$('#cv3').toBlob(b=>{if(b)saveFile(safeName(doc.name)+'_3d.png',b,'image/png');else toast('Couldn’t make the picture')},'image/png')}
function exportOBJ(){if(!doc.ents.some(e=>e.type==='wall'))return toast('Draw some walls first');const M=build3D(0,false,V3.on?V3.scope:null),L=['# WallCAD 3D model: '+String(doc.name).replace(/[\r\n]/g,' '),'# units: metres, Y up','o '+safeName(doc.name)];
  for(let i=0;i<M.p.length;i+=3)L.push(`v ${(M.p[i]/1000).toFixed(4)} ${(M.p[i+2]/1000).toFixed(4)} ${(-M.p[i+1]/1000).toFixed(4)} ${M.c[i].toFixed(3)} ${M.c[i+1].toFixed(3)} ${M.c[i+2].toFixed(3)}`);
  for(let i=1;i<=M.p.length/3;i+=3)L.push(`f ${i} ${i+1} ${i+2}`);saveFile(safeName(doc.name)+'_3d.obj',new Blob([L.join('\n')],{type:'text/plain'}),'text/plain')}
(function v3events(){const cv3=$('#cv3'),P=new Map();let last=null,pinch=null,mb=0;
  $('#v3bar').addEventListener('click',e=>{const b=e.target.closest('[data-v3]');if(!b)return;const a=b.dataset.v3;
    if(a==='close')close3D();else if(a==='orbit'){const w=V3.mode==='walk';V3.mode='orbit';if(w)v3rebuild();v3ui();v3req()}
    else if(a==='walk'){const was=V3.mode;V3.mode='walk';V3.cut=0;v3rebuild();if(was!=='walk')v3start();v3ui();v3req();toast('Walk mode: you start in the most open room',1800)}
    else if(a==='top'){const w=V3.mode==='walk';V3.mode='orbit';if(w)v3rebuild();v3fit(true);v3ui();v3req()}
    else if(a==='cut'){V3.cut=V3.cut?0:1200;if(V3.mode==='walk'){V3.mode='orbit';v3fit(false)}v3rebuild();v3ui()}else if(a==='more')v3opts();else if(a==='part')open3DChoose()});
  const pad=$('#v3pad');const pk=(e,on)=>{const b=e.target.closest('[data-k]');if(!b)return;e.preventDefault();V3.keys[b.dataset.k]=on;if(on)v3req()};
  pad.addEventListener('pointerdown',e=>pk(e,true));['pointerup','pointercancel','pointerleave'].forEach(t=>pad.addEventListener(t,e=>{const b=e.target.closest('[data-k]');if(b)V3.keys[b.dataset.k]=false}));
  cv3.addEventListener('contextmenu',e=>e.preventDefault());
  cv3.addEventListener('pointerdown',e=>{e.preventDefault();try{cv3.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,[e.clientX,e.clientY]);mb=e.button;last=[e.clientX,e.clientY];if(P.size===2){const[a,b]=[...P.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),m:[(a[0]+b[0])/2,(a[1]+b[1])/2]}}});
  cv3.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,[e.clientX,e.clientY]);
    if(P.size>=2&&pinch){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      if(V3.mode==='orbit'){V3.dist=Math.max(800,Math.min(4e5,V3.dist*pinch.d/Math.max(d,1)));v3pan(m[0]-pinch.m[0],m[1]-pinch.m[1])}else{const f=(d-pinch.d)*8;V3.ex+=Math.cos(V3.wy)*f;V3.ey+=Math.sin(V3.wy)*f}pinch={d,m};v3req();return}
    if(!last)return;const dx=e.clientX-last[0],dy=e.clientY-last[1];last=[e.clientX,e.clientY];
    if(V3.mode==='walk'){V3.wy-=dx*0.005;V3.wp=Math.max(-1.3,Math.min(1.3,V3.wp-dy*0.005))}
    else if(mb===2||mb===1||e.shiftKey)v3pan(dx,dy);else{V3.yaw-=dx*0.008;V3.pitch=Math.max(0.03,Math.min(1.53,V3.pitch+dy*0.006))}v3req()});
  const up=e=>{P.delete(e.pointerId);if(P.size<2)pinch=null;if(!P.size)last=null;else last=[...P.values()][0]};cv3.addEventListener('pointerup',up);cv3.addEventListener('pointercancel',up);
  cv3.addEventListener('wheel',e=>{e.preventDefault();if(V3.mode==='orbit')V3.dist=Math.max(800,Math.min(4e5,V3.dist*Math.exp(e.deltaY*0.0012)));else{const f=-e.deltaY*3;V3.ex+=Math.cos(V3.wy)*f;V3.ey+=Math.sin(V3.wy)*f}v3req()},{passive:false});
  const km={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',KeyD:'r',ArrowLeft:'tl',ArrowRight:'tr',KeyQ:'tl',KeyE:'tr'};
  window.addEventListener('keydown',e=>{if(!V3.on||$('#ov').classList.contains('show')||/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||''))return;e.stopImmediatePropagation();if(e.key==='Escape'){close3D();e.preventDefault();return}const k=km[e.code];V3.fast=e.shiftKey;if(k&&V3.mode==='walk'){V3.keys[k]=true;e.preventDefault();v3req()}},true);
  window.addEventListener('keyup',e=>{const k=km[e.code];if(k)V3.keys[k]=false;V3.fast=e.shiftKey});
  window.addEventListener('resize',()=>{if(V3.on)v3req()})})();
function v3pan(dx,dy){const s=V3.dist*0.0013,c=Math.cos(V3.yaw),n=Math.sin(V3.yaw);V3.tx+=(n*dx-c*dy)*s;V3.ty+=(-c*dx-n*dy)*s}

/* ================= boot ================= */
$('#bMenu').innerHTML=icon('menu');$('#bUndo').innerHTML=icon('undo');$('#bRedo').innerHTML=icon('redo');$('#bLayers').innerHTML=icon('layers');$('#bExport').innerHTML=icon('export');
$('#fFit').innerHTML=icon('fit');$('#fIn').innerHTML=icon('zin');$('#fOut').innerHTML=icon('zout');
$('#bMenu').onclick=openMenu;$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bLayers').onclick=openLayers;$('#bExport').onclick=openExport;$('#b3d').onclick=()=>{saveDoc();open3DChoose()};
$('#fFit').onclick=zoomFit;$('#fIn').onclick=()=>zoomBy(1.5);$('#fOut').onclick=()=>zoomBy(1/1.5);
$('#cEsc').onclick=()=>{if($('#ov').classList.contains('show'))return closeSheet();boxMode=false;const was=T.name;gest=null;cursor=null;sel.clear();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();finish();toast(was==='select'?'Selection cleared':'Command cancelled',1200)};
$('#cSnap').onclick=()=>{S.osnap=!S.osnap;updChips()};$('#cGrid').onclick=()=>{S.grid=!S.grid;updChips()};$('#cOrtho').onclick=()=>{S.ortho=!S.ortho;updChips()};
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveDoc()});window.addEventListener('pagehide',saveDoc);
(function boot(){
  try{const u=JSON.parse(store.get(KEY+'ui')||'null');if(u){Object.assign(S,u.S||{});theme=u.theme||theme;tab=u.tab||tab}}catch(e){}
  document.body.classList.toggle('dock-l',S.dock==='l');document.body.classList.toggle('dock-r',S.dock==='r');document.body.classList.toggle('rb-min',!!S.rbMin);
  T=TOOLS.select;const last=store.get(KEY+'last');let d=null;if(last){try{d=JSON.parse(store.get(KEY+'p.'+last))}catch(e){}}
  if(!d){d=makeSample()}
  resize();try{loadDoc(d)}catch(e){loadDoc(makeSample());setTimeout(()=>toast('Your last plan couldn’t be opened · use Menu › Projects or Restore backup',4000),500)}updChips();saveSoon();
  if(!last)setTimeout(()=>toast('Sample plan loaded · Menu › New plan to start your own',3500),400);
})();
window.WallCAD=window.PlanCAD={get doc(){return doc},_draw:()=>{draw()},_inv:()=>invalidate(),_snap:(x,y)=>snapPoint(s2w(x,y),null,"full"),setTool,buildPDF,buildDXF,view:()=>view,zoomFit,makeSample,loadDoc};
</script>
